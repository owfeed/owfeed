name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - run: go vet ./...
      - run: go build ./...

      # The integration tests reach for a real apk and real container images. They
      # are the ones that catch what unit tests cannot -- that the SDK's apk cannot
      # emit zstd, that a router accepts what was built -- so they run here rather
      # than being something only a maintainer remembers to do.
      - run: go test ./...
        env:
          OWFEED_INTEGRATION: "1"

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          [ -z "$out" ] || { echo "not gofmt'd:"; echo "$out"; exit 1; }

      # Anyone deciding whether to run this binary reads the CI first, and `go vet`
      # alone does not answer the question. errcheck is the one that earns its place
      # here: most of what owfeed does is write files and close them, and a dropped
      # error on a signing or indexing path is a feed that looks published and is not.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
