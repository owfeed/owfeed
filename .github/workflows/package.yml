name: owfeed package

# The release half of an author's repository: sign what was built, write a signed
# manifest, and publish a release a feed can ingest.
#
# IT DOES NOT BUILD, and that boundary is the ecosystem's rather than this file's.
# docs/ECOSYSTEM.md puts a package repository at `owlab (build/test) + owfeed
# (sign/release)`, split by whose key is in the job: building and asserting on a real
# router need none, signing needs one.
#
# The first draft of this file did build, and it was wrong in a way worth recording.
# A called workflow is ONE JOB to its caller, so nothing can sit between its build and
# its release — which put the caller's owlab verification after the release instead of
# before it, and a tag published a package no router had installed. Moving the
# verification inside was not open either: owfeed may not reach for owlab in the
# reusable workflow other people call. The boundary was in the wrong place, not the
# ordering.
#
# WHAT THE SHAPE ENFORCES, and each of these was got wrong somewhere in the five
# repositories this replaces:
#
#   - The release is created as a DRAFT and published in a separate step. `latest`
#     moves the moment a release is published, and the upload action attaches assets
#     AFTER creating it — so a router polling in that window resolves
#     `releases/latest/download/manifest.txt` to a release that has none and reports a
#     hard error. Three of the four repositories had that window open.
#   - Every signature is verified before publishing, against the public key committed
#     in the repository. A secret rotated without the public half being updated
#     otherwise ships a release every installer rejects with "BAD SIGNATURE" —
#     indistinguishable from the attack the signature exists to prevent.
#   - The manifest is fetched back through latest/download and compared with the one
#     just built. A 404 there means every install would have failed, and this is the
#     last moment it is a red build rather than a bug report.
#   - `owfeed release --repo` is written once. It was typed out by hand in four
#     repositories, and the `--repo` line is what stops a manifest lifted from another
#     of the author's releases verifying perfectly under this one's name.
#   - A run over a tag whose release is already published signs nothing: it checks
#     the live release and stops. adbsign's ECDSA signature is randomised, so signing
#     again puts other .apk bytes under the same names, and the upload deletes each
#     live asset before replacing it. A router installing in that window meets a 404,
#     or a package whose sha256 the manifest does not vouch for. "Re-run all jobs" on a
#     tag and a workflow_dispatch at a tag both land here.
#
# THERE IS NO SMOKE STEP. `owfeed smoke` asks whether a FEED installs without
# --allow-untrusted, and an author publishing release assets has no feed to ask about.
# The question an author wants — does the package work on a real router — is owlab's,
# in the caller's own verify job, where no key exists.
#
# Usage. The caller owns the build and the verification; this owns the keys:
#
#   jobs:
#     build:                    # no key: stage, `owfeed check`, `owfeed build`, upload
#       ...
#     verify:                   # no key: owlab installs it on a real router
#       needs: build
#       ...
#     release:
#       needs: [build, verify]  # THIS is what keeps a tag from publishing untested bytes
#       if: startsWith(github.ref, 'refs/tags/v')
#       permissions:
#         contents: write
#       uses: owfeed/owfeed/.github/workflows/package.yml@v0.5.5
#       secrets:
#         sign-key: ${{ secrets.OWFEED_SIGN_KEY }}
#         usign-key: ${{ secrets.OWFEED_RELEASE_KEY }}
#       with:
#         pre-release: sh tools/stage-release.sh
#
# The setup action is referenced by exact tag rather than a floating major, so pinning
# this workflow pins everything it runs.

on:
  workflow_call:
    inputs:
      owfeed-version:
        description: >-
          owfeed release tag to install. Leave it unset to run the release this
          workflow is pinned at; set it only to run a different one.
        required: false
        type: string
        # Empty, for the reason on the same input in feed.yml: the setup@ step below
        # installs the release it is pinned at.
        default: ""
      sign-also:
        description: >-
          Extra files to sign with the release key, space separated, resolved inside
          dist/. An installer fetched by `curl | sh` belongs here: it is not a package
          and has no place in the manifest's inventory, but it is executable code
          handed to root, and a careful admin can verify it out of band.
        required: false
        type: string
        default: ""
      artifact:
        description: >-
          Name of the artifact the caller's build job uploaded, holding one directory
          per architecture with the built packages in them.
        required: false
        type: string
        default: owfeed-packages
      pre-release:
        description: >-
          Shell run in the release job after the packages are downloaded and before
          anything is signed. Anything that has to be an asset and is not a package —
          release notes cut from a CHANGELOG, an installer — is written into dist/
          here, so it is covered by the same signing pass.
        required: false
        type: string
        default: ""
      extra-artifact:
        description: >-
          Name of another artifact from the caller's run whose files are attached to
          the release as they are: not signed and not in the manifest, so nothing a
          router installs. A demo site belongs here. The job that uploads it has to
          be in the release job's `needs:`, or the artifact may not exist yet when
          this job looks for it. They go up with the signed files while the release
          is still a draft, because a repository with immutable releases refuses any
          upload once a release is published. Release assets are flat, so the
          artifact holds files and no directories.
        required: false
        type: string
        default: ""
      notes-file:
        description: Path to a file whose contents become the release body.
        required: false
        type: string
        default: ""
      verify-with:
        description: >-
          Path to the usign PUBLIC key committed in the repository. Every signature is
          checked against it before the release is published — which catches a secret
          rotated without the public half being updated, where the symptom is
          otherwise indistinguishable from tampering.
        required: false
        type: string
        default: ""
      runs-on:
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      sign-key:
        description: >-
          EC prime256v1 SEC1 PEM. Its signature goes inside the .apk and travels to
          the router; apk signature blocks are additive, so a feed that re-signs the
          package adds its own beside this one.
        required: false
      usign-key:
        description: >-
          usign secret key. Signs manifest.txt — the inventory of the whole release,
          which the per-package signatures cannot cover. usign because it is the
          scheme OpenWrt already ships, so a router verifies it with nothing
          installed, and opkg cannot verify a standalone .ipk at all.
        required: false
    outputs:
      released:
        description: >-
          "true" when the release is published: by this run, or by an earlier run
          that this one re-checked without signing again.
        value: ${{ jobs.release.outputs.released || 'false' }}

permissions:
  contents: read

jobs:
  release:
    # A guard, not the gate: the caller decides when to call this at all, and its own
    # `needs: [build, verify]` is what keeps a tag from publishing something no router
    # has installed. This is here so a caller who forgets the `if:` cannot publish off
    # a branch.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ inputs.runs-on }}
    # A caller cannot set timeout-minutes on a `uses:` job, so without this a stalled
    # download holds the job, and the key in it, for GitHub's default six hours. Two
    # recent releases of one caller took 2 and 5.5 minutes, most of it the SDK
    # download; 30 leaves room for the retries below.
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      released: ${{ steps.publish.outputs.released || steps.state.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # See the note at the top of this file: a published release is re-checked, never
      # signed again. /releases/tags/ answers 404 for a draft, so a draft that a failed
      # attempt left behind is signed and finished as before; no router has its bytes.
      - name: Is this tag already published
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Prints what --jq selects, or nothing for a 404. Anything else is retried, and
          # no answer after four tries is an outage, exit 8, never a "not published".
          ask() {
            local i out
            for i in 1 2 3 4; do
              if out=$(gh api "repos/$GITHUB_REPOSITORY/releases/$1" --jq "$2" 2>"$RUNNER_TEMP/gh.err"); then
                printf '%s\n' "$out"
                return 0
              fi
              if grep -q '(HTTP 404)' "$RUNNER_TEMP/gh.err"; then return 0; fi
              echo "::warning::gh api repos/$GITHUB_REPOSITORY/releases/$1, attempt $i of 4: $(cat "$RUNNER_TEMP/gh.err")" >&2
              if [ "$i" -lt 4 ]; then sleep $((i * 5)); fi
            done
            echo "::error::gh api repos/$GITHUB_REPOSITORY/releases/$1 failed 4 times, so whether $GITHUB_REF_NAME is already published is unknown, and signing over a published release replaces its packages. Re-run this job once api.github.com answers (https://www.githubstatus.com)." >&2
            return 8
          }
          has_manifest=$(ask "tags/$GITHUB_REF_NAME" 'any(.assets[]; .name == "manifest.txt")')
          case "$has_manifest" in
            "")
              echo "$GITHUB_REF_NAME has no published release: signing and publishing it."
              exit 0
              ;;
            false)
              # Published by hand, or by something other than this workflow: nothing in it
              # was signed here, so signing now is not signing again.
              echo "::warning::$GITHUB_REF_NAME is published and holds no manifest.txt, so no run of this workflow finished it: signing and attaching to the live release. Until the upload ends, a router reading latest/download finds no manifest. Push the tag and let this workflow publish the release from its draft to keep that window shut."
              exit 0
              ;;
          esac
          latest=$(ask latest .tag_name)
          echo "published=true" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$GITHUB_REF_NAME" ]; then echo "latest=true" >> "$GITHUB_OUTPUT"; fi
          echo "::notice::$GITHUB_REF_NAME is already published: re-checking what is live, not signing it again. To publish it anew, delete the release first (gh release delete $GITHUB_REF_NAME --repo $GITHUB_REPOSITORY --yes; the tag stays), then re-run."

      - uses: owfeed/owfeed/setup@v0.5.5
        with:
          version: ${{ inputs.owfeed-version }}

      # merge-multiple flattens the artifact's own wrapper away and leaves what is
      # inside it alone, so dist/noarch and dist/all arrive intact — the layout
      # `owfeed release` walks.
      - if: steps.state.outputs.published != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact }}
          path: dist
          merge-multiple: true

      # Through env, never interpolated into `run:` — the same rule as `stage:`.
      - if: steps.state.outputs.published != 'true' && inputs.pre-release != ''
        env:
          SCRIPT: ${{ inputs.pre-release }}
        run: bash -euo pipefail -c "$SCRIPT"

      - name: Sign the packages
        if: steps.state.outputs.published != 'true'
        env:
          OWFEED_SIGN_KEY: ${{ secrets.sign-key }}
        run: |
          set -euo pipefail
          [ -n "${OWFEED_SIGN_KEY:-}" ] || {
            echo "no sign-key: the published package would carry no evidence of who"
            echo "built it, and no feed will carry it. Pass secrets.sign-key."
            exit 1
          }
          # Exit 8 is owfeed's "upstream outage, safe to run again": the SDK that carries
          # apk did not download, and nothing is signed before it has. Any other code is
          # an answer that asking again cannot change.
          for i in 1 2 3; do
            rc=0
            owfeed sign || rc=$?
            if [ "$rc" -eq 0 ]; then exit 0; fi
            if [ "$rc" -ne 8 ]; then exit "$rc"; fi
            if [ "$i" -eq 3 ]; then
              echo "::error::owfeed sign exited 8 three times: the OpenWrt SDK it takes apk from did not download, and nothing was signed. Re-run this job once downloads.openwrt.org answers."
              exit 8
            fi
            echo "::warning::owfeed sign: upstream outage, attempt $i of 3; trying again in $((i * 30))s"
            sleep $((i * 30))
          done

      # `--repo` is written into the manifest and readers check it against where they
      # fetched it from: a signature proves who wrote a file and never what it is
      # about, so without that line a manifest lifted from another of the author's
      # releases verifies perfectly under this one's name.
      - name: Write and sign the manifest
        if: steps.state.outputs.published != 'true'
        env:
          OWFEED_RELEASE_KEY: ${{ secrets.usign-key }}
          ALSO: ${{ inputs.sign-also }}
        run: |
          set -euo pipefail
          [ -n "${OWFEED_RELEASE_KEY:-}" ] || {
            echo "no usign-key: a release without a signed manifest is one no feed can"
            echo "ingest. Pass secrets.usign-key."
            exit 1
          }
          args=""
          for f in $ALSO; do args="$args --sign-also $f"; done
          # shellcheck disable=SC2086
          owfeed release --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" $args
          cat dist/manifest.txt

      # Release assets are flat, and owfeed leaves packages under a directory per
      # architecture because apk derives a filename from name and version alone. The
      # manifest names files without paths, which is what a router asks for, so
      # flattening is what makes the manifest and the release page agree.
      - name: Flatten
        if: steps.state.outputs.published != 'true'
        run: |
          set -euo pipefail
          for f in dist/*/*.apk dist/*/*.ipk dist/*/*.sig; do
            [ -e "$f" ] || continue
            mv "$f" dist/
          done
          rmdir dist/*/ 2>/dev/null || true
          ls -l dist

      # Into $RUNNER_TEMP and then dist/, never straight into dist/: a file that shares
      # a name with a signed one would replace it, and the check below refuses that.
      - if: steps.state.outputs.published != 'true' && inputs.extra-artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.extra-artifact }}
          path: ${{ runner.temp }}/extra-artifact

      - name: Add the unsigned files
        if: steps.state.outputs.published != 'true' && inputs.extra-artifact != ''
        env:
          SRC: ${{ runner.temp }}/extra-artifact
          ARTIFACT: ${{ inputs.extra-artifact }}
          PACKAGES: ${{ inputs.artifact }}
        run: |
          set -euo pipefail
          n=0
          for f in "$SRC"/*; do
            [ -e "$f" ] || continue
            name=$(basename "$f")
            if [ ! -f "$f" ] || [ -L "$f" ]; then
              echo "::error::$name in artifact $ARTIFACT is not a regular file, and a release asset can only be one. Upload the files themselves to $ARTIFACT, with no directory around them."
              exit 1
            fi
            # Names a router or a feed reads as signed release content.
            case "$name" in
              *.apk | *.ipk | *.sig | manifest.txt | notes.md)
                echo "::error::$name in artifact $ARTIFACT would go up unsigned under a name that readers take as signed. A package belongs in the $PACKAGES artifact, where it is signed and listed; rename anything else."
                exit 1
                ;;
            esac
            if [ -e "dist/$name" ]; then
              echo "::error::$name in artifact $ARTIFACT has the name of a file this release already carries, and would replace it. Rename one of them."
              exit 1
            fi
            mv "$f" "dist/$name"
            echo "unsigned, not in the manifest: $name"
            n=$((n + 1))
          done
          if [ "$n" -eq 0 ]; then
            echo "::error::artifact $ARTIFACT holds no files to attach. Check the upload-artifact step that names it, or drop extra-artifact."
            exit 1
          fi

      # The published release, flat, into dist/: what the checks below read on a re-run.
      - name: Fetch the published release
        if: steps.state.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4; do
            if gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir dist --clobber \
                -p manifest.txt -p manifest.txt.sig -p notes.md \
                -p '*.apk' -p '*.apk.sig' -p '*.ipk' -p '*.ipk.sig'; then
              ls -l dist
              exit 0
            fi
            if [ "$i" -lt 4 ]; then sleep $((i * 10)); fi
          done
          echo "::error::gh release download $GITHUB_REF_NAME --repo $GITHUB_REPOSITORY failed 4 times, so the published release was not re-checked. Re-run this job once github.com answers; it signs nothing either way."
          exit 1

      - name: Verify every signature with the key a router will use
        if: inputs.verify-with != ''
        env:
          PUB: ${{ inputs.verify-with }}
        run: |
          set -euo pipefail
          n=0
          for p in dist/*.apk dist/*.ipk dist/manifest.txt; do
            [ -e "$p" ] || continue
            [ -s "$p.sig" ] || { echo "no signature for $(basename "$p")"; exit 1; }
            owfeed verify-artifact --key "$PUB" --signature "$p.sig" "$p"
            echo "verified: $(basename "$p")"
            n=$((n + 1))
          done
          [ "$n" -gt 0 ] || { echo "nothing was verified — the glob found no packages"; exit 1; }

      # What a router checks before it installs anything: a manifest about this
      # repository and tag, and every file it lists present with that size and sha256.
      # It runs on every release, so it is seen passing long before a re-run needs it.
      # On a re-run it is what finds a package replaced after the manifest was written,
      # which is the damage a second signing pass leaves.
      - name: The manifest describes these files
        env:
          PUBLISHED: ${{ steps.state.outputs.published }}
        run: |
          set -euo pipefail
          m=dist/manifest.txt
          if [ "$PUBLISHED" = true ]; then
            fix="delete the release (gh release delete $GITHUB_REF_NAME --repo $GITHUB_REPOSITORY --yes; the tag stays) and re-run this job, which then signs and publishes it once"
          else
            fix="nothing is published. owfeed release wrote $m from these files in this job, so a step after it changed one; report it at https://github.com/owfeed/owfeed/issues"
          fi
          [ -s "$m" ] || { echo "::error::there is no $m to check the release files against. Fix: $fix."; exit 1; }
          errs=0
          bad() { echo "::error::$*"; errs=$((errs + 1)); }
          [ "$(head -n 1 "$m")" = "owfeed-manifest 1" ] || bad "$m does not start with 'owfeed-manifest 1'"
          grep -qx "repo $GITHUB_REPOSITORY" "$m" || bad "$m has no 'repo $GITHUB_REPOSITORY' line"
          grep -qx "tag $GITHUB_REF_NAME" "$m" || bad "$m has no 'tag $GITHUB_REF_NAME' line"
          n=0
          while read -r kind a b c d e _; do
            case "$kind" in
              pkg) file=$c size=$d sum=$e ;;
              notes) file=$b size="" sum=$a ;;
              *) continue ;;
            esac
            n=$((n + 1))
            if [ ! -f "dist/$file" ]; then bad "$m lists $file, and the release has no such file"; continue; fi
            got=$(($(wc -c < "dist/$file")))
            if [ -n "$size" ] && [ "$got" != "$size" ]; then bad "$file is $got bytes, and $m says $size"; continue; fi
            got=$(sha256sum "dist/$file" | cut -d ' ' -f 1)
            [ "$got" = "$sum" ] || bad "$file hashes to $got, and $m says $sum"
          done < "$m"
          [ "$n" -gt 0 ] || bad "$m lists no files"
          if [ "$errs" -gt 0 ]; then
            echo "::error::a router refuses the release over each line above. Fix: $fix."
            exit 1
          fi
          echo "$m lists $n file(s), each present with that size and sha256."

      # A DRAFT, flipped in the next step. See the note at the top of this file: the
      # window between "release exists" and "assets attached" is one a router can fall
      # into, and `latest` does not resolve to a draft.
      - if: steps.state.outputs.published != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          body_path: ${{ inputs.notes-file }}
          draft: true

      # Retried because one 5xx here leaves a finished draft unpublished and the tag red.
      # Publishing a release that is already published changes nothing.
      - id: publish
        if: steps.state.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4; do
            if gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"; then
              echo "released=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$i" -lt 4 ]; then sleep $((i * 10)); fi
          done
          echo "::error::gh release edit $GITHUB_REF_NAME --draft=false --repo $GITHUB_REPOSITORY failed 4 times: the release is a draft with every file attached, and no router can see it. Run that command once github.com answers, or re-run this job, which signs the draft again and publishes it."
          exit 1

      # The last moment this is a red build rather than a bug report. A router fetches
      # the manifest from the release CDN, not the API, and a 404 here means every
      # install and every update check would have failed. It runs on a re-run too, since
      # this step failing after the release went out is what invites one. Right after
      # publishing, the CDN can answer 404 or the previous release's manifest for a
      # while, so it waits about two minutes for the right answer before it fails.
      - name: The manifest resolves through latest/download
        env:
          PUBLISHED: ${{ steps.state.outputs.published }}
          LATEST: ${{ steps.state.outputs.latest }}
        run: |
          set -euo pipefail
          url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/manifest.txt"
          if [ "$PUBLISHED" = true ] && [ "$LATEST" != true ]; then
            # A re-run of a tag that a newer release has replaced as latest.
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/manifest.txt"
          fi
          fetched=""
          for i in $(seq 1 12); do
            if curl -fsSL --retry 2 --retry-connrefused --connect-timeout 10 --max-time 20 \
                -o "$RUNNER_TEMP/mf" "$url"; then
              fetched=1
              if cmp -s dist/manifest.txt "$RUNNER_TEMP/mf"; then
                echo "manifest.txt resolves through $url and matches."
                exit 0
              fi
            fi
            if [ "$i" -lt 12 ]; then sleep 10; fi
          done
          if [ -z "$fetched" ]; then
            echo "::error::curl -fsSL $url failed 12 times over two minutes, so a router installing or checking for updates now gets an error. If the release page lists manifest.txt, GitHub is slow to serve it: re-run this job, which checks again and signs nothing."
            exit 1
          fi
          diff -u dist/manifest.txt "$RUNNER_TEMP/mf" || true
          echo "::error::$url serves a manifest.txt other than the one this release carries (diff above). If its tag line names another release, that release is marked latest: gh release edit $GITHUB_REF_NAME --latest --repo $GITHUB_REPOSITORY makes this one latest. Then re-run this job, which checks again and signs nothing."
          exit 1
