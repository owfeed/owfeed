name: owfeed feed

# A reusable workflow for checking and publishing a feed to GitHub Pages.
#
# The composite action in setup/ installs the tool; this installs the SHAPE, and
# the shape is the part that is easy to get wrong. What it enforces:
#
#   - The build job never sees a signing key. Building runs whatever a feed's own
#     scripts do, and for a feed that carries other people's packages those scripts
#     came out of a pull request. A key appears only after the built bytes are
#     already in an artifact.
#   - Publishing is gated on `owfeed publish`, which refuses an unsigned or unchecked
#     tree and has no flag to say otherwise. Every hand-written feed workflow in the
#     wild ends in an unconditional upload of whatever the build step left behind.
#   - The publish job runs in an environment, so approval is the repository's to
#     configure rather than something each feed reinvents.
#   - `dry-run: true` runs the same steps against throwaway keys and stops before
#     publishing, so a pull request check and a publication are one workflow in two
#     modes rather than two files that drift apart. A green pull request that
#     exercised a different pipeline proves nothing about the one that publishes.
#
# Where the signing keys come from, and why it is written down: the publish job
# declares the environment itself, so an environment-scoped secret named
# OWFEED_SIGN_KEY or OWFEED_USIGN_KEY is read directly when the caller passes
# `secrets: inherit`. GitHub's documentation is explicit that `on.workflow_call`
# has no `environment` keyword and that a job declaring one uses the environment's
# secret rather than a passed-in value. The `sign-key` / `usign-key` inputs remain
# as the fallback for a feed that keeps its keys at repository scope. Prefer the
# environment: a key passed as a `workflow_call` secret has to be readable by the
# calling job, which means it is readable by every other workflow in that
# repository, and the environment then gates approval without scoping the secret.
#
# The setup action below is referenced by exact tag rather than a floating major, so
# that pinning this workflow pins everything it runs. RELEASING.md is the two lines
# that have to move when a release is cut.
#
# Usage -- publishing:
#
#   jobs:
#     publish:
#       permissions:            # a called workflow can only narrow these, never widen
#         contents: read        # them, so the caller grants what the publish job needs
#         pages: write
#         id-token: write
#         actions: read
#       uses: owfeed/owfeed/.github/workflows/feed.yml@v0.5.1
#       secrets: inherit        # so the publish job can read the environment's key
#       with:
#         owfeed-version: v0.5.1
#         pre-build: for d in packages/*/; do ./tools/fetch.sh "$d"; done
#         post-index: ./tools/check-tree.sh
#         smoke-releases: "25.12 24.10"
#
# Usage -- the same pipeline as a pull-request check:
#
#   jobs:
#     check:
#       permissions:            # the SAME block as above, and not a mistake: a
#         contents: read        # called workflow is validated whole, so a caller
#         pages: write          # granting less than any of its jobs declares fails
#         id-token: write       # at startup rather than skipping that job. The
#         actions: read         # check job narrows itself back to contents: read,
#       uses: owfeed/owfeed/.github/workflows/feed.yml@v0.5.1   # so nothing that
#       with:                                                     # runs holds it.
#         owfeed-version: v0.5.1
#         dry-run: true         # throwaway keys, no environment, nothing published
#         pre-build: for d in packages/*/; do ./tools/fetch.sh "$d"; done
#         post-index: ./tools/check-tree.sh
#         smoke-releases: "25.12 24.10"

on:
  workflow_call:
    inputs:
      owfeed-version:
        description: owfeed release tag to install. Pin it.
        required: true
        type: string
      dry-run:
        description: >-
          Run the whole pipeline against throwaway keys and stop before publishing.
          No environment, no secrets, safe on a pull request from a fork. What it
          cannot prove is that the real key still works; that is the publish job's
          job.
        required: false
        type: boolean
        default: false
      environment:
        description: >-
          Environment the publish job runs in. Give it required reviewers and scope
          the signing secrets to it; that is what keeps the key out of reach of
          anything that has not been looked at. Ignored under dry-run.
        required: false
        type: string
        default: feed
      pre-build:
        description: >-
          Shell run before `owfeed build`, in the job that has no key. Fetching
          upstream artifacts belongs here.
        required: false
        type: string
        default: ""
      post-index:
        description: Shell run after `owfeed index` and before the checks.
        required: false
        type: string
        default: ""
      smoke-releases:
        description: >-
          Space-separated release lines to install on a real OpenWrt image before
          publishing. Empty skips it, which means publishing a feed nothing has
          tried to install from.
        required: false
        type: string
        default: ""
      source-date-epoch:
        description: >-
          Fixed build timestamp. A package's identity is a hash over its payload and
          mkpkg records mtimes, so without this every rebuild republishes
          byte-identical content under a new identity and invalidates every cached
          copy. A constant, not a timestamp: identity should depend on what a package
          contains and nothing else.
        required: false
        type: string
        default: "1700000000"
      runs-on:
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      sign-key:
        description: >-
          EC prime256v1 SEC1 PEM. Signs apk packages and indexes. Only needed when
          the key is a repository secret; an environment secret named
          OWFEED_SIGN_KEY is read directly.
        required: false
      usign-key:
        description: >-
          usign secret key. Signs opkg indexes; required for a 24.10 line. Only
          needed when the key is a repository secret; an environment secret named
          OWFEED_USIGN_KEY is read directly.
        required: false
    outputs:
      digest:
        description: >-
          sha256 over the tree -- every file's content and path. Comparable between
          two runs of the SAME mode and never across modes: a dry run signs with a
          key it generated seconds earlier, so its signatures, and therefore its
          digest, differ from a publish of byte-identical packages. Two publishes
          that agree here published the same feed.
        value: ${{ jobs.publish.outputs.digest || jobs.check.outputs.digest }}
      published:
        description: >-
          "true" when the tree passed the gate and was deployed. False under
          dry-run, and false when the gate refused.
        value: ${{ jobs.publish.outputs.published || 'false' }}
      page-url:
        description: The URL Pages deployed to. Empty under dry-run.
        value: ${{ jobs.publish.outputs.page-url }}

permissions:
  contents: read

# Concurrency is per job rather than per workflow, because the two modes want
# opposite things. Publication is serialised across the repository and never
# cancelled -- a half-finished deploy is a broken feed. Checks are per ref and
# cancel their own predecessor, because the answer for a superseded push is of no
# interest to anyone.

jobs:
  # Runs the feed's own scripts. No key, deliberately.
  build:
    runs-on: ${{ inputs.runs-on }}
    env:
      SOURCE_DATE_EPOCH: ${{ inputs.source-date-epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: owfeed/owfeed/setup@v0.5.1
        with:
          version: ${{ inputs.owfeed-version }}

      # Through env, never interpolated into `run:` directly. A caller that passes
      # an issue title or a branch name into this input would otherwise be handing
      # whoever wrote it a shell in the job that builds the feed.
      - if: inputs.pre-build != ''
        env:
          SCRIPT: ${{ inputs.pre-build }}
        run: bash -euo pipefail -c "$SCRIPT"

      # --frozen-lock: a new architecture appearing upstream is a diff someone
      # approves, never a silent change to what this feed publishes.
      - run: owfeed --frozen-lock build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owfeed-packages
          path: dist/
          retention-days: 1

  # The pull-request half. Same steps, throwaway keys, no environment, nothing
  # leaves the runner. A fork PR reaches this and no secret is anywhere near it.
  check:
    if: inputs.dry-run
    needs: build
    runs-on: ${{ inputs.runs-on }}
    concurrency:
      group: owfeed-check-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    # Narrowed to nothing useful, deliberately. The caller has to grant the ceiling
    # the publish job below asks for -- a called workflow is validated as a whole,
    # and a caller granting less than any of its jobs declares fails at startup
    # rather than skipping that job. Declaring the floor here is what keeps that
    # grant from being held by anything that actually runs under dry-run.
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    env:
      SOURCE_DATE_EPOCH: ${{ inputs.source-date-epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: owfeed/owfeed/setup@v0.5.1
        with:
          version: ${{ inputs.owfeed-version }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: owfeed-packages
          path: dist/

      # Into the job's environment rather than one step's shell. A feed's config
      # names these variables -- `signing.usign-key: env:OWFEED_USIGN_KEY` -- so
      # every later stage that reads the config wants them too, and `owfeed doctor`
      # exits 4 on a config naming a variable that is empty. Keys that live only
      # inside the signing step take every check after it down with them.
      #
      # Both are generated here, never leave the runner, and die with it. Masked
      # anyway, so that a `set -x` in a caller's post-index script cannot echo one.
      - name: Generate throwaway keys
        run: |
          owfeed keygen -o "$RUNNER_TEMP/k.pem"
          owfeed keygen --usign -o "$RUNNER_TEMP/k.sec"
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done < "$RUNNER_TEMP/k.pem"
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done < "$RUNNER_TEMP/k.sec"
          {
            echo "OWFEED_SIGN_KEY<<OWFEED_KEY_EOF"
            cat "$RUNNER_TEMP/k.pem"
            echo "OWFEED_KEY_EOF"
            echo "OWFEED_USIGN_KEY<<OWFEED_KEY_EOF"
            cat "$RUNNER_TEMP/k.sec"
            echo "OWFEED_KEY_EOF"
          } >> "$GITHUB_ENV"
          shred -u "$RUNNER_TEMP/k.pem" "$RUNNER_TEMP/k.sec"

      - name: Sign and index
        run: |
          owfeed sign
          owfeed index

      - if: inputs.post-index != ''
        env:
          SCRIPT: ${{ inputs.post-index }}
        run: bash -euo pipefail -c "$SCRIPT"

      # `doctor` rather than `publish`: the gate belongs to the job that is about
      # to deploy, and running it here would report a tree that is fine and then
      # publish nothing, which reads as success for the wrong reason.
      - run: owfeed doctor --require-origin

      - name: Install it on a real image
        if: inputs.smoke-releases != ''
        env:
          LINES: ${{ inputs.smoke-releases }}
        run: |
          for line in $LINES; do
            owfeed smoke --release "$line"
          done

      - id: digest
        run: |
          d=$(find out -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "digest=$d" >> "$GITHUB_OUTPUT"
          echo "tree digest $d"

  publish:
    if: ${{ !inputs.dry-run }}
    needs: build
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    concurrency:
      group: owfeed-publish-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
      # deploy-pages has needed this since v4: it resolves the artifact by id
      # through the Actions API. Declaring any permissions block sets every
      # undeclared scope to none, so leaving it out is a deploy that cannot read
      # what the previous job uploaded.
      actions: read
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      published: ${{ steps.gate.outcome == 'success' }}
      page-url: ${{ steps.deploy.outputs.page_url }}
    env:
      SOURCE_DATE_EPOCH: ${{ inputs.source-date-epoch }}
      # Resolved once, here, rather than at each step that needs a key. The
      # environment secret wins: this job declares the environment, so it can read
      # one, and a key that never had to be readable by the calling workflow is a
      # key fewer workflows can reach. The input is the fallback for a feed whose
      # keys are repository secrets.
      OWFEED_SIGN_KEY: ${{ secrets.OWFEED_SIGN_KEY || secrets.sign-key }}
      OWFEED_USIGN_KEY: ${{ secrets.OWFEED_USIGN_KEY || secrets.usign-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: owfeed/owfeed/setup@v0.5.1
        with:
          version: ${{ inputs.owfeed-version }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: owfeed-packages
          path: dist/

      # Named, so that a missing key fails here with a sentence rather than
      # further down inside apk with an error about a file it could not read.
      - name: Check a signing key is reachable
        run: |
          [ -n "$OWFEED_SIGN_KEY" ] || {
            echo "no signing key: set OWFEED_SIGN_KEY in the '${{ inputs.environment }}' environment" >&2
            echo "and call this workflow with 'secrets: inherit', or pass it as the sign-key secret" >&2
            exit 4
          }

      - name: Sign and index
        run: |
          owfeed sign
          owfeed index

      - if: inputs.post-index != ''
        env:
          SCRIPT: ${{ inputs.post-index }}
        run: bash -euo pipefail -c "$SCRIPT"

      - name: Install it on a real image
        if: inputs.smoke-releases != ''
        env:
          LINES: ${{ inputs.smoke-releases }}
        run: |
          for line in $LINES; do
            owfeed smoke --release "$line"
          done

      # What is about to go out, compared against what is already live, before it
      # replaces it. A version republished with different contents is invisible from
      # inside the tree, which is self-consistent either way. Not fatal: a feed
      # publishing for the first time has nothing to compare against.
      - name: Compare against what is live
        continue-on-error: true
        run: owfeed verify out

      # The gate. Refuses an unsigned or unchecked tree, and there is no flag.
      - id: gate
        name: Check and publish
        run: owfeed publish

      - id: digest
        run: |
          d=$(find out -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "digest=$d" >> "$GITHUB_OUTPUT"
          echo "tree digest $d"

      # include-hidden-files, or the deploy silently drops `.nojekyll`. From v4 this
      # action excludes dotfiles by default, and `.nojekyll` is the file that stops
      # Pages running Jekyll over a tree of binaries -- Jekyll then drops every path
      # beginning with a dot or an underscore, from a tree that was correct when
      # owfeed checked it. `owfeed publish` refuses a tree without that file; it
      # cannot see an upload step that threw it away afterwards.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out
          include-hidden-files: true
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
