name: Pages

# Publishes owfeed.org: the site in site/, the config JSON Schema, and the
# go-import pages the module paths depend on.
#
# The schema is the part that has to be here. `owfeed init` writes its URL into the
# modeline of every config it scaffolds, so an editor fetches it -- and a modeline
# pointing at a 404 is worse than no modeline, which is why there was none until
# this workflow existed.
#
# No keys are involved anywhere. This publishes documentation; the feed is a
# different site with a different workflow, and the two must not learn to share a
# job that has a secret in it.

# Pull requests build the site and run the checks over it, but never deploy.
# A gate that only runs after the merge is not a gate: the first person to see
# a broken link would be a reader, and the fix would need a second deploy.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'schema/**'
      - 'docs/**'
      - 'README.md'
      - 'README_ru.md'
      - '.github/workflows/pages.yml'
  # The same list again: GitHub Actions does not expand YAML anchors, so the two
  # have to be kept in step by hand.
  pull_request:
    paths:
      - 'site/**'
      - 'schema/**'
      - 'docs/**'
      - 'README.md'
      - 'README_ru.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one in flight: a half-uploaded site is
# a schema URL that answers 404 for everyone whose editor asks during the gap.
#
# A pull request gets its own group so a rebuild can cancel the previous one --
# nothing is being served from it, so there is nothing to leave half-written.
concurrency:
  group: pages-${{ github.repository }}-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The schema is generated from internal/config, and the checked-in copy is
      # what gets published. Regenerating here and diffing means a stale file is
      # caught before it reaches the URL editors read, not after.
      - name: The checked-in schema matches the code
        run: go test ./internal/schema

      - name: Assemble the site
        run: |
          set -eu
          # site/ is the site: every page and the stylesheet are checked in and
          # served as they are. What follows is only the parts that cannot be --
          # the schema, which is generated from the code, the docs, which live
          # beside what they describe, and the go-import pages.
          mkdir -p _site/schema _site/docs
          cp -r site/. _site/
          cp schema/v1.json _site/schema/v1.json
          cp docs/*.md _site/docs/
          cp README.md README_ru.md _site/docs/

          # The vanity import paths. `go install owfeed.org/owfeed/cmd/owfeed@latest`
          # fetches https://owfeed.org/owfeed?go-get=1 and reads the meta tag below to
          # learn where the source actually lives.
          #
          # This is the point of the exercise and it is worth stating plainly: an
          # import path that names a host we control survives moving between accounts,
          # organisations, or off GitHub entirely. The path VizzleTF/* would not have --
          # this migration would have broken `go install` for everyone, permanently,
          # because Go module paths have no redirect. The cost is that owfeed.org is now
          # a dependency of `go install` as well as of the feed; that dependency was
          # already accepted when the feed's URL moved onto the domain.
          #
          # A human following the link gets sent to the repository rather than a blank
          # page, because a URL that only answers a robot is a URL somebody will report
          # as broken.
          for tool in owfeed owlab; do
            mkdir -p "_site/$tool"
            cat > "_site/$tool/index.html" <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <meta name="go-import" content="owfeed.org/$tool git https://github.com/owfeed/$tool">
          <meta name="go-source" content="owfeed.org/$tool https://github.com/owfeed/$tool https://github.com/owfeed/$tool/tree/main{/dir} https://github.com/owfeed/$tool/blob/main{/dir}/{file}#L{line}">
          <meta http-equiv="refresh" content="0; url=https://github.com/owfeed/$tool">
          <title>owfeed.org/$tool</title>
          <p><code>go install owfeed.org/$tool/cmd/$tool@latest</code> &mdash;
             source at <a href="https://github.com/owfeed/$tool">github.com/owfeed/$tool</a>.
          HTML
          done

          # Jekyll would delete /assets/ and every path beginning with an
          # underscore. Pages runs it unless this file is present.
          touch _site/.nojekyll

      # A sidebar link that 404s is the failure this site can produce most
      # easily: the navigation is repeated in every page by hand, so one typo is
      # invisible until somebody clicks it.
      - name: Every internal link resolves to a file
        run: |
          set -eu
          grep -rhoE 'href="/[^"#]*"' _site --include='*.html' \
            | sed 's/^href="//;s/"$//' | sort -u > /tmp/links
          broken=0
          while read -r p; do
            case "$p" in */) target="_site${p}index.html" ;; *) target="_site$p" ;; esac
            if [ ! -e "$target" ]; then echo "broken link: $p"; broken=1; fi
          done < /tmp/links
          [ "$broken" -eq 0 ] || exit 1
          echo "$(wc -l < /tmp/links) internal links, all resolve"

      # Only what is about to be served needs uploading. A pull request has
      # already had the checks run over it by this point, which is all it is here
      # for.
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # .nojekyll is a dotfile, and from v4 this action drops those unless
          # told not to. Without it Pages runs Jekyll and removes /assets/.
          include-hidden-files: true
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
