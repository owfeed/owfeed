name: Set up owfeed
description: Install a verified owfeed binary and put it on PATH.

# Why this exists rather than `go install owfeed.org/owfeed/cmd/owfeed@sha`:
# that compiles the tool on every job of a 35-architecture matrix, needs a Go
# toolchain the feed itself has no use for, and verifies nothing -- `go install`
# trusts whatever the module proxy returns for that revision. This downloads one
# binary and checks it against GitHub's own build attestation before running it.

inputs:
  version:
    description: >-
      Release tag to install, such as v0.1.3, or "latest". Leave it unset to
      install the release this action is pinned at: `setup@v0.5.3` installs
      v0.5.3. "latest" means the tool that signs your feed can change under you
      between runs.
    required: false
    # Empty, not "latest". With "latest" as the default, `uses:
    # owfeed/owfeed/setup@v0.5.2` and no `version:` looked pinned and installed
    # whatever was newest -- and the `uses:` ref is the only pin dependabot moves.
    default: ""
  verify:
    description: >-
      Verify the download against its build attestation. Turning this off means
      running an unverified binary with your signing key in the same job; there is
      no supported reason to, and it exists only so a broken Sigstore does not
      leave you with no way to publish an urgent fix.
    required: false
    default: "true"
  token:
    description: Token used to reach the release and the attestation API.
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: The version that was installed.
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        OWFEED_VERSION: ${{ inputs.version }}
        OWFEED_VERIFY: ${{ inputs.verify }}
        # The expression, not the GITHUB_ACTION_REF variable: measured on
        # 2026-09-14 (in owfeed/owlab, whose setup is the same shape), that
        # variable is empty inside a composite action's steps while
        # github.action_ref holds the ref from `uses:`.
        OWFEED_ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail

        # No version asked for: install the release this action is pinned at, so
        # `setup@v0.5.3` means owfeed 0.5.3 the way it reads. Only a release-shaped
        # tag is taken; a branch, a SHA or a local `./setup` has no release of that
        # name and keeps the old answer, with the warning further down.
        if [ -z "$OWFEED_VERSION" ]; then
          case "$OWFEED_ACTION_REF" in
            v[0-9]*.[0-9]*.[0-9]*)
              OWFEED_VERSION="$OWFEED_ACTION_REF"
              echo "installing owfeed $OWFEED_VERSION, the release this action is pinned at"
              ;;
            *)
              echo "::warning::this action was called at \"${OWFEED_ACTION_REF:-a local path}\", which is not a release tag; installing the latest release"
              OWFEED_VERSION=latest
              ;;
          esac
        fi

        case "$RUNNER_OS" in
          Linux)  os=linux ;;
          macOS)  os=darwin ;;
          *) echo "::error::owfeed has no build for $RUNNER_OS"; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64)   arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::owfeed has no build for $RUNNER_ARCH"; exit 1 ;;
        esac
        asset="owfeed-${os}-${arch}"

        dir="${RUNNER_TEMP}/owfeed"
        mkdir -p "$dir"

        # Already installed at this version, in this job. Using the action twice in
        # one job is an ordinary thing to want, and without this the second use dies
        # in `gh release download`, which refuses to overwrite a file it downloaded a
        # minute earlier. Matched on the version rather than on the file existing:
        # two steps asking for different versions have to get different binaries, or
        # the second step's `version:` is a lie.
        #
        # `latest` never short-circuits -- it has not been resolved to a tag yet, and
        # resolving it just to compare would cost the request the shortcut saves.
        if [ "$OWFEED_VERSION" != "latest" ] && [ -x "$dir/owfeed" ] \
           && [ "$("$dir/owfeed" version 2>/dev/null | awk '{print $2}')" = "${OWFEED_VERSION#v}" ]; then
          echo "owfeed ${OWFEED_VERSION#v} is already installed in this job"
          echo "$dir" >> "$GITHUB_PATH"
          exit 0
        fi

        # --clobber, because reaching here with the file present means it is a
        # different version than the one being asked for; the check above already
        # returned on an exact match.
        if [ "$OWFEED_VERSION" = "latest" ]; then
          echo "::warning::owfeed pinned to \"latest\"; pin a tag so the tool that signs your feed cannot change between runs"
          gh release download --repo owfeed/owfeed --pattern "$asset" --dir "$dir" --clobber
          tag=$(gh release view --repo owfeed/owfeed --json tagName --jq .tagName)
        else
          tag="$OWFEED_VERSION"
          gh release download "$tag" --repo owfeed/owfeed --pattern "$asset" --dir "$dir" --clobber
        fi

        # Verify BEFORE the binary is ever executed or put on PATH. A check that
        # runs after the thing it checks is not a check.
        if [ "$OWFEED_VERIFY" = "true" ]; then
          # --signer-workflow, not just --repo. Checking the repository alone accepts
          # an attestation produced by ANY workflow in it that has attestations:
          # write -- so a merged pull request adding one workflow would be enough to
          # mint a valid attestation for any bytes at all. Pinning the workflow file
          # is what makes this an assertion about how the binary was built.
          # gh writes its result to stderr, which a composite step swallows. A check
          # nobody can see ran is one nobody believes ran, so it is captured and
          # echoed either way.
          if out=$(gh attestation verify "$dir/$asset" \
              --repo owfeed/owfeed \
              --signer-workflow owfeed/owfeed/.github/workflows/release.yml 2>&1); then
            echo "$out"
            echo "verified $asset as built by owfeed/owfeed .github/workflows/release.yml"
          else
            echo "$out"
            echo "::error::$asset does not verify as built by owfeed/owfeed's release workflow -- refusing to install it"
            rm -f "$dir/$asset"
            exit 1
          fi
        else
          echo "::warning::owfeed installed without verifying its build attestation"
        fi

        chmod +x "$dir/$asset"
        mv "$dir/$asset" "$dir/owfeed"
        echo "$dir" >> "$GITHUB_PATH"

        echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
        "$dir/owfeed" version
